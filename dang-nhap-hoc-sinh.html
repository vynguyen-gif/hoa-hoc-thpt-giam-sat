<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Thí Sinh - Thi Hóa Học</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Exam Data & Student List (Pre-loaded) -->
    <script src="js/exam-data.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- FORM ĐĂNG NHẬP TỐI GIẢN Ở GIỮA MÀN HÌNH -->
    <div class="max-w-md w-full bg-white text-slate-900 rounded-3xl shadow-2xl p-8 border border-slate-100 relative">
        
        <!-- Header tối giản -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                <i data-lucide="flask-conical" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-slate-900">Đăng Nhập Thi Trực Tuyến</h1>
            <p class="text-xs text-slate-500 mt-1">Cổng thi môn Hóa học - Công văn 7991 (Lớp 11A1)</p>
        </div>

        <!-- Thông báo lỗi / trạng thái -->
        <div id="login-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold leading-relaxed"></div>

        <!-- Form chỉ gồm Username & Password -->
        <form id="student-login-form" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Tên đăng nhập (Username)
                </label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input type="text" id="username" name="username" placeholder="Ví dụ: 11A1_01 hoặc 11A101" required autofocus
                        class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 text-sm font-mono font-bold transition outline-none uppercase">
                </div>
                <!-- Nhận diện tên học sinh theo thời gian thực -->
                <div id="detected-student-badge" class="hidden mt-1.5 text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-lg font-medium flex items-center gap-1.5">
                    <i data-lucide="user-check" class="w-3.5 h-3.5 text-emerald-600"></i>
                    <span id="detected-student-name">---</span>
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Mật khẩu riêng (Password)
                </label>
                <div class="relative">
                    <i data-lucide="key-round" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input type="password" id="password" name="password" placeholder="Nhập đúng mật khẩu riêng (VD: An@167)" required
                        class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 text-sm font-mono font-bold transition outline-none">
                    <button type="button" id="toggle-pwd-btn" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600">
                        <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-[11px] text-slate-500 flex items-start gap-2">
                <i data-lucide="shield-alert" class="w-4 h-4 text-blue-600 shrink-0 mt-0.5"></i>
                <span>Cơ chế bảo mật <strong>Single-session</strong>: Mỗi tài khoản chỉ đăng nhập trên 1 thiết bị duy nhất trong kỳ thi.</span>
            </div>

            <button type="submit" id="btn-submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-500/25 transition flex items-center justify-center gap-2 cursor-pointer">
                <span>Vào Phòng Thi</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
            <span>Quên mật khẩu? Liên hệ Giám thị</span>
            <a href="index.html" class="text-blue-600 hover:underline font-medium flex items-center gap-1">
                <span>Vào thi trực tiếp</span> &rarr;
            </a>
        </div>
    </div>

    <!-- JAVASCRIPT XÁC THỰC MẬT KHẨU RIÊNG CHO TỪNG HỌC SINH -->
    <script>
        // Hàm chuẩn hóa Username: 11A1_01, 11A101, 11a1_01 đều quy về 11A101
        function normalizeCode(code) {
            return (code || '').toString().toUpperCase().replace(/[_\-\s]/g, '');
        }

        // Tìm thông tin học sinh từ DB LocalStore hoặc Danh sách Lớp 11A1
        function findStudentAccount(userCode) {
            const norm = normalizeCode(userCode);
            if (!norm) return null;

            // 1. Tìm trong supabase_students_db (nếu giáo viên vừa tạo/import trên giao-vien-import.html)
            try {
                const localDb = JSON.parse(localStorage.getItem('supabase_students_db') || '[]');
                const found = localDb.find(s => {
                    const uNorm = normalizeCode(s.username || s.sbd);
                    return uNorm === norm;
                });
                if (found) {
                    return {
                        id: found.id || found.username,
                        username: found.username || found.sbd,
                        name: found.ho_ten || found.name,
                        className: found.ten_lop || '11A1',
                        password: (found.password || '').toString().trim()
                    };
                }
            } catch (e) {
                console.warn(e);
            }

            // 2. Tìm trong INITIAL_STUDENTS_11A1 (danh sách chuẩn có sẵn)
            if (typeof INITIAL_STUDENTS_11A1 !== 'undefined') {
                const found = INITIAL_STUDENTS_11A1.find(s => {
                    const sNorm1 = normalizeCode(s.sbd);
                    const sNorm2 = normalizeCode(s.sbd_alt);
                    return sNorm1 === norm || sNorm2 === norm;
                });
                if (found) {
                    return {
                        id: found.sbd,
                        username: found.sbd,
                        name: found.name,
                        className: '11A1',
                        password: (found.password || '').toString().trim()
                    };
                }
            }

            return null;
        }

        // Tự động nhận diện Họ tên khi gõ Username
        const usernameInput = document.getElementById('username');
        const detectedBadge = document.getElementById('detected-student-badge');
        const detectedName = document.getElementById('detected-student-name');
        const loginAlert = document.getElementById('login-alert');

        usernameInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            const student = findStudentAccount(val);
            if (student) {
                detectedBadge.classList.remove('hidden');
                detectedName.textContent = `Học sinh: ${student.name} (${student.className})`;
                loginAlert.classList.add('hidden');
            } else {
                detectedBadge.classList.add('hidden');
            }
        });

        // Toggle Password hiển thị
        const toggleBtn = document.getElementById('toggle-pwd-btn');
        const pwdInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isText = pwdInput.type === 'text';
            pwdInput.type = isText ? 'password' : 'text';
            const icon = document.getElementById('eye-icon');
            if (icon) {
                icon.setAttribute('data-lucide', isText ? 'eye' : 'eye-off');
                if (window.lucide) window.lucide.createIcons();
            }
        });

        // Xử lý Đăng Nhập
        const loginForm = document.getElementById('student-login-form');
        const submitBtn = document.getElementById('btn-submit');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawUser = usernameInput.value.trim();
            const rawPass = pwdInput.value.trim();

            if (!rawUser || !rawPass) {
                showAlert('Vui lòng nhập đầy đủ Username và Mật khẩu!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin mr-1"></i> Đang xác thực...`;
            if (window.lucide) window.lucide.createIcons();

            // Tìm tài khoản học sinh
            const student = findStudentAccount(rawUser);

            if (!student) {
                showAlert(`Không tìm thấy tài khoản "${rawUser}" trong danh sách Lớp 11A1! Vui lòng nhập đúng Username (Ví dụ: 11A1_01 hoặc 11A101).`, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Vào Phòng Thi</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                if (window.lucide) window.lucide.createIcons();
                return;
            }

            // Đối soát Mật khẩu riêng
            if (student.password !== rawPass) {
                showAlert(`Mật khẩu không chính xác cho thí sinh <strong>${student.name}</strong> (${rawUser})!<br/>Vui lòng nhập đúng mật khẩu riêng của bạn (chú ý chữ hoa/thường và ký tự @).`, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Vào Phòng Thi</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                if (window.lucide) window.lucide.createIcons();
                return;
            }

            // Đăng nhập thành công -> Sinh session_token duy nhất
            const sessionToken = 'tok_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
            
            // Lưu thông tin đăng nhập vào LocalStorage
            localStorage.setItem('student_id', student.id);
            localStorage.setItem('current_student_session', JSON.stringify({
                studentId: student.id,
                username: student.username,
                name: student.name,
                className: student.className,
                sessionToken: sessionToken,
                loginAt: new Date().toISOString()
            }));

            // Cập nhật session token vào bộ nhớ đồng bộ
            try {
                let localDb = JSON.parse(localStorage.getItem('supabase_students_db') || '[]');
                const idx = localDb.findIndex(s => normalizeCode(s.username || s.sbd) === normalizeCode(student.username));
                if (idx !== -1) {
                    localDb[idx].current_session_token = sessionToken;
                    localDb[idx].last_login_at = new Date().toISOString();
                    localStorage.setItem('supabase_students_db', JSON.stringify(localDb));
                }
            } catch (err) {}

            // Bắn tín hiệu ngắt phiên session cũ ở các tab khác
            if (typeof BroadcastChannel !== 'undefined') {
                const bc = new BroadcastChannel('chem_proctoring_channel');
                bc.postMessage({
                    type: 'STUDENT_SESSION_UPDATE',
                    username: student.username,
                    activeSessionToken: sessionToken
                });
            }

            showAlert(`Đăng nhập thành công! Xin chào <strong>${student.name}</strong>. Đang vào phòng chờ thi...`, 'success');

            setTimeout(() => {
                window.location.href = 'phong-cho.html';
            }, 600);
        });

        function showAlert(msg, type) {
            loginAlert.classList.remove('hidden');
            if (type === 'error') {
                loginAlert.className = 'mb-4 p-3 rounded-xl text-xs font-medium bg-rose-50 border border-rose-200 text-rose-800';
                loginAlert.innerHTML = `
                    <div class="flex items-start gap-2">
                        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600 shrink-0 mt-0.5"></i>
                        <div>${msg}</div>
                    </div>
                `;
            } else {
                loginAlert.className = 'mb-4 p-3 rounded-xl text-xs font-medium bg-emerald-50 border border-emerald-200 text-emerald-800';
                loginAlert.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600 shrink-0"></i>
                        <div>${msg}</div>
                    </div>
                `;
            }
            if (window.lucide) window.lucide.createIcons();
            loginAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
